spring:
  application:
    name: ${SPRING_APPLICATION_NAME:transaction-service}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER_CLASS_NAME}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${JPA_PROPERTIES_HIBERNATE_DIALECT}
        format_sql: ${JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}

  security:
    oauth2:
      resourceserver:
        jwt:
          # TODO: Replace with the service URL.
          issuer-uri: http://localhost:8081/issuer-path

server:
  port: ${SERVER_PORT:8082}
