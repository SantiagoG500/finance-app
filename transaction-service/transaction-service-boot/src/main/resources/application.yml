spring:
  application:
    name: ${SPRING_APPLICATION_NAME:transaction-service}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER_CLASS_NAME}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${JPA_PROPERTIES_HIBERNATE_DIALECT}
        format_sql: ${JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
        ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8080}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
  exchangerate:
    url: ${EXCHANGERATE_API_URL:https://v6.exchangerate-api.com/v6}
    api-key: ${EXCHANGERATE_API_KEY:}
  restcountries:
    url: ${RESTCOUNTRIES_API_URL:https://api.restcountries.com}
    api-key: ${RESTCOUNTRIES_API_KEY:}
