services:
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: account-service
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JPA_HIBERNATE_DDL_AUTO: update
      JPA_OPEN_IN_VIEW: "false"
      JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
    networks:
      - finanzas-net

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: transaction-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - account-service
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: transaction-service
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JPA_HIBERNATE_DDL_AUTO: update
      JPA_OPEN_IN_VIEW: "false"
      JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET}
      ACCOUNT_SERVICE_URL: http://account-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
    networks:
      - finanzas-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - account-service
    environment:
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: notification-service
      JWT_SECRET: ${JWT_SECRET}
      ACCOUNT_SERVICE_URL: http://account-service:8080
      emailuser: ${emailuser}
      emailpass: ${emailpass}
      JAVA_TOOL_OPTIONS: "-Xmx350m -Xms128m"
    networks:
      - finanzas-net

networks:
  finanzas-net:
    driver: bridge